        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Python 的 \d 会匹配全角数字（１９８８），JS 的 \d 只认半角。这里把正则里的 \d 统一换成"半角+全角"，行为与 Python 版一致。
        function _pyPat(p) {
            let out = '', inClass = false;
            for (let i = 0; i < p.length; i++) {
                const c = p[i];
                if (c === '\\') {
                    const n = p[i + 1];
                    if (n === 'd') out += inClass ? '0-9０-９' : '[0-9０-９]';
                    else out += c + (n === undefined ? '' : n);
                    i++;
                } else {
                    if (!inClass && c === '[') inClass = true;
                    else if (inClass && c === ']') inClass = false;
                    out += c;
                }
            }
            return out;
        }

            const key = flags + '\u0000' + pattern;
            let r = _RE_CACHE.get(key);
            if (!r) {
                r = new RegExp(_pyPat(pattern), flags);
                _RE_CACHE.set(key, r);
            }
            return r;
        }
        function _pyInt(s) {
            return parseInt(String(s).replace(/[０-９]/g, ch => String(ch.charCodeAt(0) - 0xff10)), 10);

            const i = s.indexOf(a);
            return i < 0 ? s : s.slice(0, i) + b + s.slice(i + a.length);

        // ================= 字数长短提醒：超过项目规定的字数，该行"名称"变黄色 =================
        // LENGTH_RULES（上方数据表）= [项目名, [[列号, 最多允许的"中文字数"], ...]]，字数"超过"（大于）这个数才变黄。
        // 列号对应表格从左到右（从 0 开始）：0名称 1指定 2农历 3年历 4姓名 5性别 6属相 7年龄 8年 9月 10日 11时辰 12其他 13小人
        // 字数换算：1 个中文字 = 1 个字；英文字母、数字、标点符号、空格、其他符号 = 半个字
        function _isCjkChar(ch) {
            const o = ch.codePointAt(0);
            return (0x4E00 <= o && o <= 0x9FFF) || (0x3400 <= o && o <= 0x4DBF) || (0xF900 <= o && o <= 0xFAFF)
                || (0x20000 <= o && o <= 0x2FA1F) || (0x3040 <= o && o <= 0x30FF) || (0xAC00 <= o && o <= 0xD7AF);
        }

        function calcDisplayLen(text) {
            text = String(text).replace(/<[^>]+>/g, '');
            let total = 0.0;
            for (const ch of text) {
                if ('\r\n\u2028\u2029'.includes(ch)) continue;
                total += _isCjkChar(ch) ? 1.0 : 0.5;
            }
            return total;
        }

        function getLengthWarning(row) {
            // 这一行是否超过所属项目的字数规则。超过返回 [列号, 实际字数, 允许字数]，没超过返回 null
            const name = row ? String(row[0]).replace(/<[^>]+>/g, '') : "";
            for (const [proj, rules] of LENGTH_RULES) {
                if (name.startsWith(proj)) {
                    for (const [col, limit] of rules) {
                        if (col < row.length) {
                            const n = calcDisplayLen(row[col]);
                            if (n > limit) return [col, n, limit];
                        }
                    }
                    return null;
                }
            }
            return null;
        }

        // ================= 整体解析（对应桌面版 processOrders 的数据部分，不碰界面） =================
        function parseOrders(rawText) {
            const text = rawText.trim();
            const data = [];
            const stats = {};
            if (!text) return { data: data, stats: stats };

            const blocks = text.split(/\n[\s​-‏‪-‮⁠-⁩﻿͏]*\n/);
            const typeCounts = {};
            let globalProducts = [];
            let _firstBlock = true;

            for (const block of blocks) {
                const cleanBlock = block.trim();
                if (!cleanBlock) continue;

                const person = extractPersonInfo(cleanBlock);
                const currentBlockProducts = extractProductsFromBlock(cleanBlock);
                if (currentBlockProducts.length) globalProducts = currentBlockProducts;
                const productsToApply = currentBlockProducts.length ? currentBlockProducts : (globalProducts.length ? inheritedQtyProducts(cleanBlock, globalProducts) : globalProducts);

                const valid_for_process = (person.name !== "") || productsToApply.some(p => FANGYU_LIKE.includes(p.type));

                // 【第一个订单无法识别项目】只有排在最前面的第一个订单识别不出项目时，输出一个空行占位（中间的不识别订单仍按原逻辑跳过）
                if (_firstBlock && !currentBlockProducts.length) {
                    data.push(new Array(14).fill(""));
                }
                _firstBlock = false;

                if (valid_for_process && productsToApply.length) {
                    for (const prod of productsToApply) {
                        typeCounts[prod.type] = (typeCounts[prod.type] || 0) + 1;
                        const row = buildRow(prod, person, typeCounts[prod.type]);
                        data.push(row);
                        stats[prod.type] = (stats[prod.type] || 0) + 1;
                    }
                }
            }
            return { data: data, stats: stats };
        }

        // ================= 界面部分（表格显示：红字 + 字数超限黄色提醒） =================
        const RED_SPAN_RE = /<span style='color:#ff4444;'>([\s\S]*?)<\/span>/g;
        function cellToSegments(cell) {
            // 把带 <span> 的单元格字符串拆成 [[文字, 是否红字], ...]
            cell = String(cell);
            const segs = [];
            let pos = 0;
            for (const m of cell.matchAll(RED_SPAN_RE)) {
                if (m.index > pos) segs.push([cell.slice(pos, m.index), false]);
                segs.push([m[1], true]);
                pos = m.index + m[0].length;
            }
            if (pos < cell.length) segs.push([cell.slice(pos), false]);
            return segs;
        }

            const text = document.getElementById('inputArea').value.trim();

            if (warn) {
                first.classList.add('name-warn');
                first.title = `${COL_NAMES[warn[0]]}列 ${warn[1]} 字，超过规定的 ${warn[2]} 字`;
            } else {
                first.classList.remove('name-warn');
                first.removeAttribute('title');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            for (let row of globalProcessedData) {
                let tr = document.createElement('tr');
                for (let cell of row) {
                    let td = document.createElement('td');
                    // 文字用 textContent 放入（不会被当成网页代码），红字部分单独包一层红色
                    for (const [t, red] of cellToSegments(cell)) {
                        if (red) {
                            const sp = document.createElement('span');
                            sp.style.color = '#ff4444';
                            sp.textContent = t;
                            td.appendChild(sp);
                        } else {
                            td.appendChild(document.createTextNode(t));
                        }
                    }
                    td.contentEditable = "true";
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
                updateLengthWarning(tr);
            }
        }

        // 在表格里直接修改内容后，名称的黄色提醒随之刷新
        document.getElementById('tableBody').addEventListener('input', function (e) {
            const tr = e.target && e.target.closest ? e.target.closest('tr') : null;
            if (tr) updateLengthWarning(tr);
        });

        function copyTableData() {
            const tbody = document.getElementById('tableBody');
            const rows = tbody.querySelectorAll('tr');
            if (rows.length === 0) {
                alert("没有数据可复制！");
                return;
            }
            let tsvLines = [];
            rows.forEach(tr => {
                let rowData = [];
                tr.querySelectorAll('td').forEach(td => {
                    rowData.push(td.innerText.replace(/\n/g, ' '));
                });
                tsvLines.push(rowData.join('\t'));
            });

            navigator.clipboard.writeText(tsvLines.join('\n')).then(() => {
                alert('数据已复制，可直接粘贴到 Excel/Numbers 中。');
            }).catch(err => {
                alert('复制失败，请手动选中表格复制。');
            });
        }

        function getDefaultDateFileName() {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `自动${mm}${dd}`;
        }

        function openShareModal() {
            const tbody = document.getElementById('tableBody');
            if (tbody.querySelectorAll('tr').length === 0) {
                alert("请先解析数据！");
                return;
            }
            document.getElementById('shareFilenameInput').value = getDefaultDateFileName();
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        function confirmShareToWeChat() {
            let userInputName = document.getElementById('shareFilenameInput').value.trim();
            const defaultName = getDefaultDateFileName();
            
            userInputName = userInputName === "" ? defaultName : userInputName;
            if (!userInputName.toLowerCase().endsWith('.csv')) {
                userInputName += '.csv';
            }
            const filename = userInputName;

            closeShareModal();

            const header = ["名称", "指定", "农历", "年历", "姓名", "性别", "属相", "年龄", "年", "月", "日", "时辰", "其他", "小人"];
            let csvContent = header.join(",") + "\r\n";
            
            const tbody = document.getElementById('tableBody');
            const rows = tbody.querySelectorAll('tr');

            rows.forEach(tr => {
                let cleanRow = [];
                tr.querySelectorAll('td').forEach(td => {
                    let str = td.innerText;
                    str = str.replace(/"/g, '""');
                    if (str.includes(',') || str.includes('\n') || str.includes('"')) {
                        str = `"${str}"`;
                    }
                    cleanRow.push(str);
                });
                csvContent += cleanRow.join(",") + "\r\n";
            });

            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });

            // \u4F18\u5148\uFF1A\u76F4\u63A5\u8C03\u51FA\u7CFB\u7EDF\u5206\u4EAB\u9762\u677F\uFF08\u9009\u5FAE\u4FE1 \u2192 \u9009\u597D\u53CB/\u6587\u4EF6\u4F20\u8F93\u52A9\u624B\u5373\u53EF\uFF09\uFF0C\u4E0D\u518D\u5148\u4E0B\u8F7D
            // \u4E0D\u652F\u6301\u6587\u4EF6\u5206\u4EAB\u7684\u73AF\u5883\uFF08\u5982\u7535\u8111\u6D4F\u89C8\u5668\uFF09\uFF0C\u81EA\u52A8\u9000\u56DE\u539F\u6765\u7684\u4E0B\u8F7D\u65B9\u5F0F
            if (navigator.share && navigator.canShare && typeof File === 'function') {
                let file = null;
                try { file = new File([blob], filename, { type: 'text/csv' }); } catch (e) { file = null; }
                if (file && navigator.canShare({ files: [file] })) {
                    navigator.share({ files: [file] }).catch(err => {
                        if (err && err.name === 'AbortError') return;   // \u81EA\u5DF1\u70B9\u4E86\u53D6\u6D88\uFF0C\u4E0D\u5904\u7406
                        downloadCsvFile(blob, filename);
                    });
                    return;
                }
            }
            downloadCsvFile(blob, filename);
        }

        function downloadCsvFile(blob, filename) {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.styleSheets && (link.style.display = "none");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 100);
        }
    </script>
</body>
