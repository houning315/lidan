<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>皇恩寺理单系统 (Web)</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: rgba(30, 30, 30, 0.6);
            --gold: #d4af37;
            --gold-hover: #b88a00;
            --text-main: #f7e7ce;
            --text-muted: #999999;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 15px;
            padding-bottom: 40px;
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 11px;
            color: #8a6d3b;
            letter-spacing: 1px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn-caishen {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-bar {
            font-size: 13px;
            color: var(--gold);
            text-align: center;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        
        textarea:focus {
            border-color: var(--gold);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-parse {
            background-color: var(--gold);
            color: #000;
        }
        .btn-parse:active { background-color: var(--gold-hover); }

        .btn-share {
            background-color: transparent;
            color: #07c160; 
            border: 1px solid #07c160;
        }
        .btn-share:active { background-color: rgba(7, 193, 96, 0.1); }
        
        .btn-copy {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #555;
        }

        /* Table Wrapper */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        
        /* 增加可编辑单元格的聚焦样式 */
        td[contenteditable="true"]:focus {
            outline: 2px solid var(--gold);
            background-color: rgba(212, 175, 55, 0.1);
            border-radius: 4px;
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* 自定义Modal弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        .modal-title { font-size: 16px; color: var(--gold); font-weight: bold; margin-bottom: 6px; }
        .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; }
        .modal-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .btn-modal-confirm { background: var(--gold); color: #000; font-size: 14px; padding: 10px; }
        .btn-modal-cancel { background: transparent; color: var(--text-muted); border: 1px solid #555; font-size: 14px; padding: 10px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="title">智能理单系统</div>
        <div class="subtitle">化太岁 | 清水寺 | 补财库 | 消灾 | 贵人<br>学业 | 健康 | 爱情 | 踩小人 | 放鱼</div>
        <button class="btn-caishen" onclick="window.location.href='caishen.html'">财神理单系统</button>
        <div style="font-size: 11px; color: var(--text-muted);">每个客户信息以空行分隔</div>
    </div>

    <div class="glass-panel">
        <textarea id="inputArea" placeholder="请在此粘贴订单内容..."></textarea>
        <div class="action-buttons">
            <button class="btn-parse" onclick="processOrders()">解析数据</button>
            <button class="btn-share" onclick="openShareModal()">导出CSV并分享至微信</button>
            <button class="btn-copy" onclick="copyTableData()">复制数据表格</button>
        </div>
    </div>

    <div class="status-bar" id="statusLabel">状态：系统就绪 | 待命</div>

    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>名称</th><th>指定</th><th>农历</th><th>年历</th><th>姓名</th><th>性别</th><th>属相</th><th>年龄</th><th>年</th><th>月</th><th>日</th><th>时辰</th><th>其他</th><th>小人</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>

    <div id="shareModal" class="modal-overlay" style="display: none;">
        <div class="modal-box glass-panel">
            <div class="modal-title">自定义导出文件名</div>
            <div class="modal-subtitle">无需输入后缀（如修改为：1000）</div>
            <input type="text" id="shareFilenameInput" class="modal-input" placeholder="请输入文件名" />
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeShareModal()">取消</button>
                <button class="btn-modal-confirm" onclick="confirmShareToWeChat()">确认导出并分享</button>
            </div>
        </div>
    </div>

    <script>
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        const ZODIACS = "鼠牛虎兔龙蛇马羊猴鸡狗猪鼠牛虎兔龍蛇馬羊猴雞狗豬";
        const CN_NUMS = ["零", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十"];

        const KEYWORDS = {
            '化太岁': ['化太岁符', '化太歲符', '太岁符', '太歲符', '化太岁', '化太歲', '太岁', '太歲'],
            '清水寺': ['清水寺符', '清水庙符', '清水廟符', '清水寺', '清水廟', '清水庙'],
            '补财库': ['补财库符', '補財庫符', '财库符', '財庫符', '补财库', '補財庫', '财库', '財庫'],
            '消灾': ['消灾符', '消灾福', '消災符', '消災福', '化凶星', '消灾', '消災'],
            '健康': ['健康符', '健康福', '健康桶', '健康'],
            '接贵人': ['接贵人符', '贵人符', '迎贵人符', '接貴人符', '貴人符', '迎貴人符', '接贵人', '贵人', '迎贵人', '接貴人', '貴人', '迎貴人'],
            '学业': ['学业符', '事业符', '學業符', '事業符', '学业', '事业', '學業', '事業'],
            '爱情': ['爱情符', '愛情符', '爱情', '愛情'],
            '踩小人': ['送穷鬼踩小人符', '送穷鬼踩小人', '送窮鬼踩小人符', '送窮鬼踩小人', '踩小人符', '踩小人', '送穷鬼', '送窮鬼'],
            '放鱼': ['放生鱼', '放生魚', '放鱼', '放魚', '放生']
        };

        let ALL_PRODUCT_KEYWORDS = [];
        for (let key in KEYWORDS) {
            ALL_PRODUCT_KEYWORDS.push(...KEYWORDS[key]);
        }
        ALL_PRODUCT_KEYWORDS.push(...[
            "清水寺", "清水廟", "清水庙", "清水寺符", "清水庙符", "清水廟符",
            "四方贵人", "四方貴人", "八方贵人", "八方貴人",
            "踩小人", "送穷鬼", "送窮鬼", "放鱼", "放魚", "放生", "放生鱼", "放生魚"
        ]);
        ALL_PRODUCT_KEYWORDS = Array.from(new Set(ALL_PRODUCT_KEYWORDS)).sort((a, b) => b.length - a.length);

        const PREFIX_QTY_PATTERN = "(?:(?:([一二两三四五六七八九十]+|[0-9]+)\\s*(?:份|桶|位)\\s*)|(?:([一二两三四五六七八九十]+)\\s*))?";
        const PREFIX_QTY_NO_CAPTURE = "(?:(?:[一二两三四五六七八九十]+|[0-9]+)\\s*(?:份|桶|位)\\s*|(?:[一二两三四五六七八九十]+)\\s*)?";

        function is_product_line(line_text) {
            for (let kw of ALL_PRODUCT_KEYWORDS) {
                if (line_text.includes(kw)) return true;
            }
            return false;
        }

        function formatQty(q) {
            if (!q) return "一份";
            let num_str = String(q).trim().replace(/[份桶位]/g, '');
            if (/^\d+$/.test(num_str)) {
                let n = parseInt(num_str);
                if (n >= 1 && n <= 10) num_str = CN_NUMS[n];
                else return "一份";
            } else {
                let valid_cn = ["一", "二", "两", "三", "四", "五", "六", "七", "八", "九", "十"];
                if (!valid_cn.includes(num_str)) return "一份";
            }
            if (num_str === "二") num_str = "两";
            return num_str + "份";
        }

        function extractProductsFromBlock(text) {
            let products = [];
            let scanText = text;

            let qingshui_keys = [
                "清水寺健康符", "清水寺健康", "清水健康", 
                "清水廟健康符", "清水廟健康", "清水庙健康符", "清水庙健康",
                "清水寺", "清水廟", "清水庙"
            ];
            qingshui_keys = Array.from(new Set(qingshui_keys)).sort((a, b) => b.length - a.length);

            let matched_qingshui = false;
            for (let qk of qingshui_keys) {
                if (scanText.includes(qk)) {
                    matched_qingshui = true;
                    scanText = scanText.replaceAll(qk, "");
                }
            }
            if (matched_qingshui) products.push({ type: '清水寺', qty: "一份" });

            if (/[四4]方贵人[！!❗]*|[四4]方貴人[！!❗]*/.test(scanText)) products.push({ type: '接贵人', qty: "四份" });
            if (/[八8]方贵人[！!❗]*|[八8]方貴人[！!❗]*/.test(scanText)) products.push({ type: '接贵人', qty: "八份" });

            for (let p_type in KEYWORDS) {
                if (p_type === '清水寺') continue;
                let sorted_keys = [...KEYWORDS[p_type]].sort((a, b) => b.length - a.length);
                for (let key of sorted_keys) {
                    if (scanText.includes(`双${key}`) || scanText.includes(`雙${key}`) || scanText.includes(`${key}双份`) || scanText.includes(`${key}雙份`) || scanText.includes(`${key}双桶`) || scanText.includes(`${key}雙桶`) || scanText.includes(`${key}双位`) || scanText.includes(`${key}雙位`)) {
                        let qty = p_type === '放鱼' ? "两桶" : "两份";
                        products.push({ type: p_type, qty: qty });
                    } else {
                        let regexStr = `${PREFIX_QTY_PATTERN}${escapeRegExp(key)}[！!❗]*\\s*(各)?\\s*(?:[*+＋×·・]?\\s*([0-9一二两三四五六七八九十]+))?\\s*(?:份|桶|位)?[！!❗]*`;
                        let regex = new RegExp(regexStr, 'g');
                        let match;
                        while ((match = regex.exec(scanText)) !== null) {
                            let qty_str = match[4] || match[1] || match[2];
                            let fmt_qty = formatQty(qty_str);
                            if (p_type === '放鱼') fmt_qty = fmt_qty.replace('份', '桶');
                            products.push({ type: p_type, qty: fmt_qty });
                        }
                    }
                }
            }

            let typeMap = new Map();
            for (let p of products) {
                if (!typeMap.has(p.type)) {
                    typeMap.set(p.type, p);
                } else {
                    let existing = typeMap.get(p.type);
                    if ((existing.qty === "一份" || existing.qty === "一桶") && (p.qty !== "一份" && p.qty !== "一桶")) {
                        typeMap.set(p.type, p);
                    }
                }
            }
            let unique = Array.from(typeMap.values());

            let has_fangyu = unique.some(p => p.type === '放鱼');
            if (has_fangyu) {
                let lines = text.split(/\r?\n/);
                let fangyu_lines = lines.filter(line => KEYWORDS['放鱼'].some(kw => line.includes(kw)));

                let filtered_unique = [];
                for (let p of unique) {
                    if (p.type === '放鱼') {
                        filtered_unique.push(p);
                    } else {
                        let other_kws = KEYWORDS[p.type] || [];
                        if (p.type === '清水寺') other_kws = qingshui_keys;
                        else if (p.type === '接贵人') other_kws = [...KEYWORDS['接贵人'], '四方贵人', '四方貴人', '4方贵人', '4方貴人', '八方贵人', '八方貴人', '8方贵人', '8方貴人'];

                        let is_on_same_line = false;
                        for (let f_line of fangyu_lines) {
                            if (other_kws.some(kw => f_line.includes(kw))) {
                                is_on_same_line = true;
                                break;
                            }
                        }
                        if (is_on_same_line) filtered_unique.push(p);
                    }
                }
                return filtered_unique;
            }

            return unique;
        }

        function extractPersonInfo(text) {
            if (text.includes("踩小人") || text.includes("送穷鬼")) {
                text = text.replaceAll("客户多多", "顾客多多");
            }

            let name = "";
            let titlePattern = /^(?:名字|姓名|真实姓名|真實姓名|名称|名稱|客户|客戶)[:：\s]*/;
            let delimiters = " \n\r\t\xA0,.,\\(\\)（）\uff0c\uff1a:;；";
            let lines = text.split(/\r?\n/);

            for (let line of lines) {
                let tempLine = line.trim();
                if (!tempLine) continue;
                if (titlePattern.test(tempLine)) {
                    let extracted = tempLine.replace(titlePattern, "").trim();
                    let m = extracted.match(/^[\u4e00-\u9fa5]{2,4}/);
                    if (m) {
                        name = m[0];
                        break;
                    }
                }
            }

            if (!name) {
                let cleanTextForName = text;
                let allKeys = Object.values(KEYWORDS).flat().map(escapeRegExp).join("|");
                let pattern = new RegExp(`([^${delimiters}]*(?:${allKeys})[^${delimiters}]*)`, 'g');
                cleanTextForName = cleanTextForName.replaceAll(pattern, " ");
                let parts = cleanTextForName.split(new RegExp(`[${delimiters}]`));
                for (let p of parts) {
                    let pClean = p.trim();
                    if (["名字", "姓名", "真实姓名", "真實姓名", "客户", "客戶"].includes(pClean)) continue;
                    let m = pClean.match(/^[\u4e00-\u9fa5]{2,4}/);
                    let exclusions = ["皇恩寺", "属相", "屬相", "生肖", "属", "屬", "性别", "性別", "农历", "農曆", "阴历", "陰曆", "新历", "新曆", "国历", "國曆", "阳历", "陽曆", "年份", "出生", "虚岁", "虛歲", "年龄", "年齡", "岁数", "出生年月日", "出生年月日阳历"];
                    if (m && !exclusions.includes(m[0])) {
                        name = m[0];
                        break;
                    }
                }
            }

            let textWithoutName = text;
            if (name) textWithoutName = text.replaceAll(name, "____");
            
            let zodiac = "";
            for (let z of ZODIACS) {
                if (textWithoutName.includes(z)) { zodiac = z; break; }
            }
            if (!zodiac) {
                for (let z of ZODIACS) {
                    if (text.includes(z)) { zodiac = z; break; }
                }
            }

            let gender = text.includes("男") ? "男" : (text.includes("女") ? "女" : "");

            let y = "", m_val = "", d_val = "", fullDate = "", secondDate = "";
            let allDates = [];

            let calendar_keys = ['农历', '農曆', '阴历', '陰曆', '新历', '新曆', '国历', '國曆', '阳历', '陽曆'];
            let cal_pattern = "((?:" + calendar_keys.join("|") + ")?)\\s*";
            let monthPatternStr = "(闰?[一二三四五六七八九十\\d]{1,2}月|正月|腊月|冬月|\\d{1,2})";

            let dateRegex = new RegExp(cal_pattern + "(\\d{4})[^\\d]{0,7}?" + monthPatternStr + "[^\\d]*?(初?[\\d一二三四五六七八九十]{1,3})(?:日|号)?", 'g');
            let mMatch;
            while ((mMatch = dateRegex.exec(text)) !== null) {
                let prefix = mMatch[1] || "";
                let tempY = mMatch[2];
                let mRaw = mMatch[3];
                let tempM = mRaw.replace(/^0/, '');
                if (/^\d+月$/.test(mRaw)) tempM = mRaw.replace('月', '').replace(/^0/, '');
                
                let dayRaw = mMatch[4];
                let tempD = dayRaw.startsWith('初') ? dayRaw : dayRaw.replace(/^0/, '');
                
                let fDate = `${tempY}年${tempM}${tempM.includes('月') ? '' : '月'}${tempD}${tempD.includes('日') ? '' : '日'}`;
                allDates.push({ y: tempY, m: tempM, d: tempD, fullDate: fDate, prefix: prefix, raw: mMatch[0] });
            }

            let ymdRegex = new RegExp(cal_pattern + "(\\d{4})[-./年]?(\\d{2})[-./月]?(\\d{2})(?:日|号)?", 'g');
            while ((mMatch = ymdRegex.exec(text)) !== null) {
                let prefix = mMatch[1] || "";
                let tempY = mMatch[2];
                let tempM = mMatch[3].replace(/^0/, '');
                let tempD = mMatch[4].replace(/^0/, '');
                let fDate = `${tempY}年${tempM}月${tempD}日`;
                if (!allDates.some(dObj => dObj.fullDate === fDate)) {
                    allDates.push({ y: tempY, m: tempM, d: tempD, fullDate: fDate, prefix: prefix, raw: mMatch[0] });
                }
            }

            allDates.sort((a, b) => {
                let posA = text.indexOf(a.raw);
                let posB = text.indexOf(b.raw);
                return (posA === -1 ? 999 : posA) - (posB === -1 ? 999 : posB);
            });

            if (allDates.length > 0) {
                y = allDates[0].y; m_val = allDates[0].m; d_val = allDates[0].d; fullDate = allDates[0].fullDate;
            }
            if (allDates.length > 1) {
                secondDate = allDates[1].fullDate;
            }

            let ageNum = "";
            let isNominalAge = false;
            let ageMatch = text.match(/(年龄|年齡|虚岁|虛歲|岁数|周岁|周歲)[:：\s]*(\d+)|(\d+)\s*(周岁|周歲|岁|歲|虛歲|虚岁)/);
            if (ageMatch) {
                ageNum = ageMatch[2] || ageMatch[3];
                let ageLabelText = ageMatch[1] || ageMatch[4];
                if (ageLabelText && (ageLabelText.includes("虚") || ageLabelText.includes("虛"))) {
                    isNominalAge = true;
                }
            }

            if (!ageNum) {
                let textForAgeSearch = text;
                for (let dObj of allDates) {
                    textForAgeSearch = textForAgeSearch.replaceAll(dObj.raw, " ");
                }
                
                let allKeysSorted = Object.values(KEYWORDS).flat().sort((a,b) => b.length - a.length);
                for (let k of allKeysSorted) {
                    let safeKey = escapeRegExp(k);
                    let kwRegex = new RegExp(`${PREFIX_QTY_NO_CAPTURE}(双|雙)?[！!❗]*${safeKey}[！!❗]*\\s*\\d*\\s*(?:各)?\\s*(?:[*+＋×·・]?\\s*[0-9一二两三四五六七八九十]+)?\\s*(?:份|桶|位)?[！!❗]*`, 'g');

        function convertToZodiacHour(timeStr, rawText) {
            if (!timeStr) return "吉";
            let zMatch = timeStr.match(/[子丑寅卯辰巳午未申酉戌亥吉]/);
            if (zMatch) return zMatch[0];
            
            let hour = -1;
            let cnMatch = timeStr.match(/([一二三四五六七八九十]{1,2})点/);
            if (cnMatch) {
                let cnMap = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"十一":11,"十二":12};
                hour = cnMap[cnMatch[1]] !== undefined ? cnMap[cnMatch[1]] : -1;
            } else {
                let numMatch = timeStr.match(/(\d{1,2})/);
                if (numMatch) hour = parseInt(numMatch[1]);
            }

            if (hour === -1) return "吉";
            let lowerText = rawText.toLowerCase();
            if (["下午", "pm", "晚上", "夜里"].some(x => lowerText.includes(x)) && hour < 12) hour += 12;
            if (["上午", "am", "凌晨", "早上", "早晨"].some(x => lowerText.includes(x)) && hour === 12) hour = 0;

            let zArr = ["子","丑","丑","寅","寅","卯","卯","辰","辰","巳","巳","午","午","未","未","申","申","酉","酉","戌","戌","亥","亥","子"];
            return (hour >= 0 && hour < 24) ? zArr[hour] : "吉";
        }

                    for (let prod of productsToApply) {
                        typeCounts[prod.type] = (typeCounts[prod.type] || 0) + 1;
                        let row = buildRow(prod, person, typeCounts[prod.type]);
                        globalProcessedData.push(row);
                        stats[prod.type] = (stats[prod.type] || 0) + 1;
                    }
                }
            }

            renderTable();

            let statusText = `总计: ${globalProcessedData.length} &nbsp;|&nbsp; ` + 
                             Object.entries(stats).map(([k, v]) => `${k}: ${v}`).join(" &nbsp; ");
            document.getElementById('statusLabel').innerHTML = statusText;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            for (let row of globalProcessedData) {
                let tr = document.createElement('tr');
                for (let cell of row) {
                    let td = document.createElement('td');
                    td.innerText = cell;
                    td.contentEditable = "true";
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function copyTableData() {
            const tbody = document.getElementById('tableBody');
            const rows = tbody.querySelectorAll('tr');
            if (rows.length === 0) {
                alert("没有数据可复制！");
                return;
            }
            let tsvLines = [];
            rows.forEach(tr => {
                let rowData = [];
                tr.querySelectorAll('td').forEach(td => {
                    rowData.push(td.innerText.replace(/\n/g, ' '));
                });
                tsvLines.push(rowData.join('\t'));
            });

            navigator.clipboard.writeText(tsvLines.join('\n')).then(() => {
                alert('数据已复制，可直接粘贴到 Excel/Numbers 中。');
            }).catch(err => {
                alert('复制失败，请手动选中表格复制。');
            });
        }

        function getDefaultDateFileName() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        function openShareModal() {
            const tbody = document.getElementById('tableBody');
            if (tbody.querySelectorAll('tr').length === 0) {
                alert("请先解析数据！");
                return;
            }
            document.getElementById('shareFilenameInput').value = getDefaultDateFileName();
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        async function confirmShareToWeChat() {
            let userInputName = document.getElementById('shareFilenameInput').value.trim();
            const defaultName = getDefaultDateFileName();
            
            userInputName = userInputName === "" ? defaultName : userInputName;
            if (!userInputName.toLowerCase().endsWith('.csv')) {
                userInputName += '.csv';
            }
            const filename = userInputName;

            closeShareModal();

            const header = ["名称", "指定", "农历", "年历", "姓名", "性别", "属相", "年龄", "年", "月", "日", "时辰", "其他", "小人"];
            let csvContent = header.join(",") + "\r\n";
            
            const tbody = document.getElementById('tableBody');
            const rows = tbody.querySelectorAll('tr');

            rows.forEach(tr => {
                let cleanRow = [];
                tr.querySelectorAll('td').forEach(td => {
                    let str = td.innerText;
                    str = str.replace(/"/g, '""');
                    if (str.includes(',') || str.includes('\n') || str.includes('"')) {
                        str = `"${str}"`;
                    }
                    cleanRow.push(str);
                });
                csvContent += cleanRow.join(",") + "\r\n";
            });

            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const file = new File([blob], filename, { type: 'text/csv' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: '理单数据',
                        text: '理单导出的CSV文件，请查收。'
                    });
                } catch (error) {
                    console.log('分享取消或失败:', error);
                }
            } else {
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                alert("您的浏览器不支持直接分享文件，已为您自动下载CSV文件。");
            }
        }
    </script>
